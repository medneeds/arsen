# Servidor estatico do SPA (build Vite em /dist).
# Objetivo: eliminar o erro de "stale chunk apos deploy" (index.html cacheado
# apontando para /assets/*.js com hash antigo, que o servidor devolvia como
# index.html => erro de MIME "text/html"). Tres regras:
#   1. index.html nunca cacheado (deploy novo aparece na hora);
#   2. /assets/* imutavel (os hashes garantem seguranca);
#   3. /assets/* inexistente => 404 REAL, sem fallback SPA (so navegacao HTML cai
#      no index.html).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  # index.html: sempre revalidado.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Assets hasheados: cache longo e imutavel; se nao existir, 404 real (nunca SPA).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback SO para rotas de navegacao (nunca para arquivos de asset).
  # Arquivo real (favicon, robots, svg...) continua servido aqui. Rota de
  # navegacao (ex.: /mapa, /prescricao) nao casa arquivo e vai para @spa_index.
  #
  # O PULO DO GATO: antes o fallback servia o index.html por este mesmo bloco,
  # SEM header de cache. O Edge entao cacheava o HTML da rota por heuristica e,
  # no deploy seguinte, continuava apontando para /assets/*.js com hash antigo
  # (404 real => stale chunk). O no-cache so pegava o /index.html DIRETO, nunca
  # a navegacao por rota. Agora o fallback serve com o MESMO no-cache.
  location / {
    try_files $uri $uri/ @spa_index;
  }

  # index.html servido ao navegar por rota de SPA — sempre revalidado, igual ao
  # /index.html direto. Sem isto, o cache do navegador servia index antigo.
  location @spa_index {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files /index.html =404;
  }
}
