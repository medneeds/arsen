# Servidor estatico do SPA (build Vite em /dist).
# Objetivo: eliminar o erro de "stale chunk apos deploy" (index.html cacheado
# apontando para /assets/*.js com hash antigo, que o servidor devolvia como
# index.html => erro de MIME "text/html"). Tres regras:
#   1. index.html nunca cacheado (deploy novo aparece na hora);
#   2. /assets/* imutavel (os hashes garantem seguranca);
#   3. /assets/* inexistente => 404 REAL, sem fallback SPA (so navegacao HTML cai
#      no index.html).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  # index.html: sempre revalidado.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Assets hasheados: cache longo e imutavel; se nao existir, 404 real (nunca SPA).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback SO para rotas de navegacao (nunca para arquivos de asset).
  # Arquivo real (favicon, robots, svg...) continua servido aqui. Rota de
  # navegacao (ex.: /mapa, /prescricao) nao casa arquivo e vai para @spa_index.
  #
  # O PULO DO GATO: antes o fallback servia o index.html por este mesmo bloco,
  # SEM header de cache. O Edge entao cacheava o HTML da rota por heuristica e,
  # no deploy seguinte, continuava apontando para /assets/*.js com hash antigo
  # (404 real => stale chunk). O no-cache so pegava o /index.html DIRETO, nunca
  # a navegacao por rota. Agora o fallback serve com o MESMO no-cache.
  location / {
    try_files $uri $uri/ @spa_index;
  }

  # index.html servido ao navegar por rota de SPA — sempre revalidado, igual ao
  # /index.html direto. Sem isto, o cache do navegador servia index antigo.
  location @spa_index {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files /index.html =404;
  }
}

# ─────────────────────────────────────────────────────────────────────────────
# Site institucional (divulgacao) em arsen.com.br
#
# Serve a landing estatica public/site/index.html (copiada para
# /usr/share/nginx/html/site/index.html no build) na RAIZ "/". E uma pagina
# autocontida (logo em data-URI, CSS e JS inline), entao basta servir esse unico
# arquivo; nao depende de assets irmaos.
#
# Convive no MESMO container do app clinico: o bloco acima (server_name _) segue
# atendendo hmdm.arsen.com.br (o SPA); este so responde quando o Host e
# arsen.com.br / www.arsen.com.br.
#
# PARA ATIVAR (fora do codigo, feito pelo Artur):
#   1. DNS: apontar arsen.com.br e www.arsen.com.br para o servidor do Dokploy.
#   2. Dokploy: adicionar arsen.com.br (e www) como dominios deste servico, para
#      o Traefik rotear o Host ate este container, e emitir o TLS.
# Enquanto o DNS/Dokploy nao apontarem para ca, este bloco fica inerte (ninguem
# chega nele) — nao afeta o hmdm.
# ─────────────────────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name arsen.com.br www.arsen.com.br;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  # arsen.com.br e o DOMINIO PRINCIPAL: raiz = pagina institucional (marketing);
  # TODAS as outras rotas = o app React (SPA) — /implantacao, login, etc., gated
  # por login como no hmdm. Mesmo container/dist; muda so o roteamento por Host.

  # Raiz: pagina institucional. Match EXATO para nao capturar as rotas do app.
  location = / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files /site/index.html =404;
  }

  # Conteudo proprio do site institucional, se referenciar algo sob /site/.
  location /site/ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ =404;
  }

  # Assets hasheados do app — necessarios para /implantacao e demais rotas do SPA.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Demais rotas = o app (SPA). Arquivo estatico real na raiz (favicon, robots,
  # svg) e servido direto; o resto cai no index.html do app, sempre revalidado,
  # e o React Router resolve a rota (ex.: /implantacao).
  location / {
    try_files $uri $uri/ @app_index;
  }
  location @app_index {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files /index.html =404;
  }
}
